name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (no tests)
        run: mvn -B -DskipTests package

      # D13 之后把下面这行改成 mvn -B verify，跑单元测试
      - name: Unit tests
        run: mvn -B test
        continue-on-error: true
