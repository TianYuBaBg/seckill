server:
  port: 8080

spring:
  application:
    name: seckill
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：必须写 127.0.0.1，不能写 localhost —— Windows 上 localhost 会优先解析成 IPv6 ::1，
    # 而 WSL 里的 MySQL/Redis 只在 IPv4 上监听，会连不上（同理适用于 Docker Desktop 的端口映射）
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/seckill?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 200
          max-idle: 50
          min-idle: 10
  rabbitmq:
    host: ${MQ_HOST:127.0.0.1}
    port: ${MQ_PORT:5672}
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 4
        max-concurrency: 16

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.wangtianyu.seckill: debug
